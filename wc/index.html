<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>診療のご感想 | ことびあクリニック</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green:        #4aae50;
    --green-dark:   #378a3b;
    --green-light:  #e8f5e9;
    --green-pale:   #f2faf2;
    --green-mid:    #b8deba;
    --yellow:       #f5e642;
    --yellow-soft:  #fdf9d0;
    --white:        #ffffff;
    --bg:           #f5fdf5;
    --text:         #1e3a22;
    --text-sub:     #4a6e4e;
    --text-muted:   #8aaa8e;
    --border:       #d0ebd2;
    --shadow:       0 8px 40px rgba(60,130,65,0.13);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 40px;
    /* 内装イメージ：白ベース、ライトグリーンのグラデ */
    background: linear-gradient(175deg, #ffffff 0%, #edf8ee 55%, #dff2e0 100%);
    position: relative;
    overflow-x: hidden;
  }

  /* 内装の黄色ドットをイメージした装飾 */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 220px; height: 220px;
    background: rgba(245,230,66,0.18);
    top: -60px; left: -60px;
  }
  body::after {
    width: 160px; height: 160px;
    background: rgba(74,174,80,0.12);
    bottom: -40px; right: -40px;
  }

  /* 追加ドット */
  .dot-tl, .dot-br, .dot-tr {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .dot-tl {
    width: 80px; height: 80px;
    background: rgba(74,174,80,0.10);
    top: 60px; left: 20px;
  }
  .dot-br {
    width: 120px; height: 120px;
    background: rgba(245,230,66,0.13);
    bottom: 60px; right: 10px;
  }
  .dot-tr {
    width: 50px; height: 50px;
    background: rgba(74,174,80,0.09);
    top: 30px; right: 40px;
  }

  /* ロゴ */
  .logo-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 22px;
    animation: fadeDown 0.5s ease both;
  }
  .logo-img {
    width: 148px;
    height: auto;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* カード */
  .card {
    position: relative;
    z-index: 1;
    background: var(--white);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 42px 38px 34px;
    max-width: 500px;
    width: 100%;
    animation: fadeUp 0.55s ease both;
    border: 1px solid rgba(74,174,80,0.15);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* カード上部のグリーンバー */
  .card-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--green) 0%, #7dd47f 60%, var(--yellow) 100%);
    border-radius: 24px 24px 0 0;
  }

  h1 {
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.65;
    margin-bottom: 6px;
    text-align: center;
  }
  .subtitle {
    font-size: 12.5px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 30px;
    line-height: 1.8;
  }

  /* セクションラベル */
  .section-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--green-dark);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ★ 星評価 */
  .star-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .star-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    transition: transform 0.15s ease;
    outline: none;
    line-height: 1;
  }
  .star-btn:hover { transform: scale(1.18); }
  .star-btn:hover ~ .star-btn .star-svg { fill: #e0e0e0; stroke: #ccc; }

  .star-svg {
    width: 44px;
    height: 44px;
    fill: #e0e0e0;
    stroke: #ccc;
    stroke-width: 1.5;
    transition: fill 0.18s ease, stroke 0.18s ease, transform 0.18s ease;
    display: block;
  }

  .star-btn.active .star-svg,
  .star-btn.hovered .star-svg {
    fill: #f5c842;
    stroke: #d4a800;
  }

  .star-btn.active {
    animation: starPop 0.22s cubic-bezier(0.175,0.885,0.32,1.275) both;
  }
  @keyframes starPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.28); }
    100% { transform: scale(1); }
  }

  /* 評価ラベル */
  .rating-labels {
    display: flex;
    justify-content: space-between;
    padding: 0 6px;
    margin-bottom: 8px;
  }
  .rating-labels span {
    font-size: 10px;
    color: var(--text-muted);
  }

  /* 選択中の評価テキスト */
  .rating-text {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-dark);
    min-height: 20px;
    margin-bottom: 26px;
    transition: opacity 0.2s;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 22px 0;
  }

  textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    background: var(--green-pale);
    line-height: 1.75;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  textarea:focus {
    border-color: var(--green);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(74,174,80,0.12);
  }
  textarea::placeholder { color: #c0d8c2; }

  .char-count {
    text-align: right;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 5px;
    margin-bottom: 24px;
  }

  .submit-btn {
    width: 100%;
    padding: 15px;
    background: var(--green);
    color: var(--white);
    border: none;
    border-radius: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.07em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .submit-btn:hover:not(:disabled) {
    background: var(--green-dark);
    box-shadow: 0 6px 20px rgba(55,138,59,0.28);
    transform: translateY(-1px);
  }
  .submit-btn:active:not(:disabled) { transform: translateY(0); }
  .submit-btn:disabled {
    background: var(--green-mid);
    color: #fff;
    cursor: not-allowed;
    opacity: 0.7;
  }

  .spinner {
    display: inline-block;
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 7px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .privacy-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 13px;
    line-height: 1.7;
  }

  .error-msg {
    display: none;
    background: #fff5f5;
    border: 1px solid #ffcccc;
    color: #c0392b;
    border-radius: 10px;
    padding: 11px 15px;
    font-size: 13px;
    margin-top: 11px;
    text-align: center;
  }
  .error-msg.visible { display: block; }

  /* 完了画面 */
  .thankyou {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8px 0;
    animation: fadeUp 0.5s ease both;
  }
  .thankyou.visible { display: flex; }
  .form-content.hidden { display: none; }

  .check-circle {
    width: 82px; height: 82px;
    background: var(--green-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 20px;
    animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    box-shadow: 0 4px 18px rgba(74,174,80,0.18);
  }
  @keyframes popIn {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .thankyou h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--green-dark);
    margin-bottom: 12px;
  }
  .thankyou p {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.85;
    max-width: 300px;
  }

  .footer-note {
    position: relative;
    z-index: 1;
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    letter-spacing: 0.05em;
  }

  @media (max-width: 480px) {
    .card { padding: 30px 18px 24px; }
    .star-svg { width: 36px; height: 36px; }
    h1 { font-size: 17px; }
    .logo-img { width: 120px; }
  }
</style>
</head>

    <p class="privacy-note">🔒 回答は安全に送信されます。個人が特定されることはありません。</p>
  </div>

  <div class="thankyou" id="thankyou">
    <div class="check-circle">✅</div>
    <h2>ありがとうございました！</h2>
    <p>ご回答を受け付けました。いただいたご意見を参考に、より快適な診療環境づくりに努めてまいります。</p>
  </div>
</div>

<p class="footer-note">© COTOVIA CLINIC, Singapore</p>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxsJ88-HzGT08SAi7Px748eTjBEMYvxLsTsdVGjPc8W4lGZQfwBAfm5BH43vSlfx5CZ2g/exec";

  const LABELS = ['', 'とても悪かった', '悪かった', '普通', '良かった', 'とても良かった'];
  let selectedRating = 0;

  function getStars() {
    return document.querySelectorAll('.star-btn');
  }

  function hoverStar(val) {
    getStars().forEach(btn => {
      const v = parseInt(btn.dataset.value);
      btn.classList.toggle('hovered', v <= val);
      btn.classList.remove('active');
    });
  }

  function unhoverStar() {
    getStars().forEach(btn => {
      btn.classList.remove('hovered');
      const v = parseInt(btn.dataset.value);
      btn.classList.toggle('active', v <= selectedRating);
    });
  }

  function selectStar(val) {
    selectedRating = val;
    getStars().forEach(btn => {
      const v = parseInt(btn.dataset.value);
      btn.classList.toggle('active', v <= val);
      btn.classList.remove('hovered');
    });
    document.getElementById('ratingText').textContent = '★'.repeat(val) + '　' + LABELS[val];
    document.getElementById('submitBtn').disabled = false;
  }

  function updateCharCount() {
    document.getElementById('charCount').textContent =
      document.getElementById('comment').value.length;
  }

  async function submitFeedback() {
    const btn      = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const comment  = document.getElementById('comment').value.trim();
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>送信中...';
    errorMsg.classList.remove('visible');
    let deviceId = localStorage.getItem('cotovia_device_id');
    if (!deviceId) {
      deviceId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 10);
      try { localStorage.setItem('cotovia_device_id', deviceId); } catch (e) {}
    }
    const payload = {
      source:       "wc",
      rating:       selectedRating,
      comment:      comment,
      timestamp:    new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }),
      userAgent:    navigator.userAgent,
      deviceId:     deviceId,
      meetingInfo:  '',
      referrer:     document.referrer || ''
    };
    try {
      await fetch(GAS_URL, {
        method: 'POST',
        mode:   'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      });
      document.getElementById('formContent').classList.add('hidden');
      document.getElementById('thankyou').classList.add('visible');
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.innerHTML = '送信する';
      errorMsg.classList.add('visible');
    }
  }
</script>
</body>
</html>
